schemes:
  - https
swagger: "2.0"
info:
  description: "VectorChat API. Authentication: first request a token via POST
    /public/oauth/token (see
    http://localhost:4456/#tag/apikey/POST/public/oauth/token), then use
    'Authorize' with Bearer <token>."
  title: VectorChat API
  contact: {}
  version: "1.0"
host: api.vectorchat.rke2.devs-group.com
basePath: /
paths:
  /agent/sessions/{sessionID}/approve:
    post:
      security:
        - BearerAuth: []
      description: Submit an approval decision for a tool call
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - agent
      summary: Approve or deny a tool call
      parameters:
        - type: string
          description: Session ID
          name: sessionID
          in: path
          required: true
        - type: string
          description: Approval ID
          name: approval_id
          in: query
          required: true
        - description: Decision
          name: request
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.AgentApprova\
              lDecisionRequest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /agent/sessions/{sessionID}/compact:
    post:
      security:
        - BearerAuth: []
      description: Compact the session context
      produces:
        - application/json
      tags:
        - agent
      summary: Compact agent session
      parameters:
        - type: string
          description: Session ID
          name: sessionID
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /agent/sessions/{sessionID}/events:
    get:
      security:
        - BearerAuth: []
      description: Stream agent status events for a session
      produces:
        - text/event-stream
      tags:
        - agent
      summary: Stream agent events
      parameters:
        - type: string
          description: Session ID
          name: sessionID
          in: path
          required: true
      responses:
        "200":
          description: Streamed events
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /agent/sessions/{sessionID}/interrupt:
    post:
      security:
        - BearerAuth: []
      description: Interrupt a running agent session
      produces:
        - application/json
      tags:
        - agent
      summary: Interrupt agent session
      parameters:
        - type: string
          description: Session ID
          name: sessionID
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /agent/sessions/{sessionID}/review:
    post:
      security:
        - BearerAuth: []
      description: Trigger a review pass for the agent session
      produces:
        - application/json
      tags:
        - agent
      summary: Review agent session
      parameters:
        - type: string
          description: Session ID
          name: sessionID
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /agent/sessions/{sessionID}/undo:
    post:
      security:
        - BearerAuth: []
      description: Undo the latest agent action
      produces:
        - application/json
      tags:
        - agent
      summary: Undo last agent step
      parameters:
        - type: string
          description: Session ID
          name: sessionID
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /agent/{chatbotID}/sessions:
    post:
      security:
        - BearerAuth: []
      description: Start or continue an agent session for a chatbot
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - agent
      summary: Start an agent session
      parameters:
        - type: string
          description: Chatbot ID
          name: chatbotID
          in: path
          required: true
        - description: Agent start request
          name: request
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.AgentStartRe\
              quest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.AgentStartRe\
              sponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /api/chatbots/import:
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Agents
      summary: Import agent configuration
      parameters:
        - description: Agent export data
          name: agent
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.AgentImportR\
              equest"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.AgentImportR\
              esponse"
  /api/chatbots/{chatbotId}/conversations:
    post:
      description: Create new conversation session for chatbot
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - conversations
      summary: Create conversation
      parameters:
        - type: string
          description: Chatbot ID
          name: chatbotId
          in: path
          required: true
        - description: Optional initial message
          name: request
          in: body
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.CreateConver\
              sationRequest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Conversation"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /api/chatbots/{id}/export:
    get:
      produces:
        - application/json
      tags:
        - Agents
      summary: Export agent configuration
      parameters:
        - type: string
          description: Chatbot ID
          name: id
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.AgentExport"
  /api/collections:
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Collections
      summary: Create collection
      parameters:
        - description: Collection payload
          name: collection
          in: body
          required: true
          schema:
            $ref: "#/definitions/internal_api.CreateCollectionRequest"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_internal_db.Collection"
  /api/collections/{id}:
    get:
      produces:
        - application/json
      tags:
        - Collections
      summary: Get collection
      parameters:
        - type: string
          description: Collection ID
          name: id
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_internal_db.Collection"
    put:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Collections
      summary: Update collection
      parameters:
        - type: string
          description: Collection ID
          name: id
          in: path
          required: true
        - description: Collection updates
          name: collection
          in: body
          required: true
          schema:
            $ref: "#/definitions/internal_api.UpdateCollectionRequest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_internal_db.Collection"
    delete:
      tags:
        - Collections
      summary: Delete collection
      parameters:
        - type: string
          description: Collection ID
          name: id
          in: path
          required: true
      responses:
        "204":
          description: No Content
  /api/collections/{id}/records:
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Collections
      summary: Import records (replaces all existing)
      parameters:
        - type: string
          description: Collection ID
          name: id
          in: path
          required: true
        - description: Records to import
          name: records
          in: body
          required: true
          schema:
            $ref: "#/definitions/internal_api.ImportRecordsRequest"
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties:
              type: integer
  /api/collections/{id}/records/export:
    get:
      produces:
        - application/json
        - text/csv
      tags:
        - Collections
      summary: Export records as JSON or CSV
      parameters:
        - type: string
          description: Collection ID
          name: id
          in: path
          required: true
        - type: string
          default: json
          description: "Export format: json or csv"
          name: format
          in: query
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: object
              additionalProperties: true
  /api/conversations:
    get:
      description: Get paginated list of conversations for authenticated user
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - conversations
      summary: List conversations
      parameters:
        - type: string
          description: Filter by chatbot ID
          name: chatbot_id
          in: query
        - type: integer
          description: Max results (default 50, max 100)
          name: limit
          in: query
        - type: integer
          description: Pagination offset (default 0)
          name: offset
          in: query
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Conversation\
              ListResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /api/conversations/{sessionId}:
    get:
      description: Get conversation with full message history
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - conversations
      summary: Get conversation details
      parameters:
        - type: string
          description: Session ID
          name: sessionId
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Conversation\
              Detail"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
    delete:
      description: Soft delete conversation
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - conversations
      summary: Delete conversation
      parameters:
        - type: string
          description: Session ID
          name: sessionId
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /api/conversations/{sessionId}/rename:
    post:
      description: Update conversation title
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - conversations
      summary: Rename conversation
      parameters:
        - type: string
          description: Session ID
          name: sessionId
          in: path
          required: true
        - description: New title
          name: request
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.RenameConver\
              sationRequest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Conversation\
              UpdateResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /api/skills:
    get:
      produces:
        - application/json
      tags:
        - Skills
      summary: List skills
      parameters:
        - type: integer
          description: Limit
          name: limit
          in: query
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Skill"
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Skills
      summary: Create skill
      parameters:
        - description: Skill payload
          name: skill
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.CreateSkillR\
              equest"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Skill"
  /api/skills/generate:
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Skills
      summary: Generate skill content from description (no persistence)
      parameters:
        - description: Description payload
          name: payload
          in: body
          required: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.SkillDraft"
  /api/skills/{id}:
    get:
      produces:
        - application/json
      tags:
        - Skills
      summary: Get skill
      parameters:
        - type: string
          description: Skill ID
          name: id
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Skill"
    put:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - Skills
      summary: Update skill
      parameters:
        - type: string
          description: Skill ID
          name: id
          in: path
          required: true
        - description: Skill payload
          name: skill
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.UpdateSkillR\
              equest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.Skill"
    delete:
      tags:
        - Skills
      summary: Delete skill
      parameters:
        - type: string
          description: Skill ID
          name: id
          in: path
          required: true
      responses:
        "204":
          description: No Content
  /api/skills/{skillId}/mcp-servers:
    get:
      produces:
        - application/json
      tags:
        - MCP Servers
      summary: List MCP servers for a skill
      parameters:
        - type: string
          description: Skill ID
          name: skillId
          in: path
          required: true
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.MCPServerRes\
                ponse"
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - MCP Servers
      summary: Create MCP server
      parameters:
        - type: string
          description: Skill ID
          name: skillId
          in: path
          required: true
        - description: MCP server payload
          name: server
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.CreateMCPSer\
              verRequest"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.MCPServerRes\
              ponse"
  /api/skills/{skillId}/mcp-servers/test:
    post:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - MCP Servers
      summary: Test MCP server connection
      parameters:
        - type: string
          description: Skill ID
          name: skillId
          in: path
          required: true
        - description: Test connection payload
          name: server
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.TestMCPServe\
              rRequest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.TestMCPServe\
              rResponse"
  /api/skills/{skillId}/mcp-servers/{id}:
    put:
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - MCP Servers
      summary: Update MCP server
      parameters:
        - type: string
          description: Skill ID
          name: skillId
          in: path
          required: true
        - type: string
          description: MCP Server ID
          name: id
          in: path
          required: true
        - description: MCP server payload
          name: server
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.UpdateMCPSer\
              verRequest"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.MCPServerRes\
              ponse"
    delete:
      tags:
        - MCP Servers
      summary: Delete MCP server
      parameters:
        - type: string
          description: Skill ID
          name: skillId
          in: path
          required: true
        - type: string
          description: MCP Server ID
          name: id
          in: path
          required: true
      responses:
        "204":
          description: No Content
  /api/supported-extensions:
    get:
      produces:
        - application/json
      tags:
        - uploads
      summary: Get supported file extensions
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
  /api/tools/catalog:
    get:
      produces:
        - application/json
      tags:
        - Tools
      summary: List tool catalog
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.ToolCatalogE\
                ntry"
  /auth/apikey:
    get:
      security:
        - BearerAuth: []
      description: Lists OAuth clients created by the authenticated user with
        pagination support
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - apiKey
      summary: List OAuth clients
      parameters:
        - type: integer
          description: "Page number (default: 1)"
          name: page
          in: query
        - type: integer
          description: "Items per page (default: 10, max: 100)"
          name: limit
          in: query
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIKeysListR\
              esponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
    post:
      security:
        - BearerAuth: []
      description: Creates a new machine-to-machine OAuth client via Ory Hydra for the
        authenticated user
      consumes:
        - application/json
      produces:
        - application/json
      tags:
        - apiKey
      summary: Provision OAuth client
      parameters:
        - description: API Key Details
          name: apiKey
          in: body
          required: true
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIKeyCreate\
              Request"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIKeyCreate\
              Response"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_yourusername_vectorchat_pkg_models.APIResponse"
  /auth/apikey/{id}:
    delete:
      security:
