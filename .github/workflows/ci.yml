name: CI/CD Pipeline

# Releases are tag-driven: a push to main runs tests only, pushing a `v*` tag
# builds both images (version baked in from the tag) and deploys them.
on:
  pull_request:
    paths:
      - '.github/**'
      - 'frontend/**'
      - 'backend/**'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NUXT_IMAGE: ghcr.io/${{ github.repository }}/nuxt
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.all.outputs.all }}
      backend: ${{ steps.filter.outputs.backend || steps.all.outputs.all }}
      workflow: ${{ steps.filter.outputs.workflow || steps.all.outputs.all }}
      e2e: ${{ steps.filter.outputs.e2e || steps.all.outputs.all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A release tag must run the full suite: there is no meaningful "before"
      # to diff against, so every filter is forced true.
      - name: Force full run on tags
        id: all
        if: ${{ github.ref_type == 'tag' }}
        run: echo "all=true" >> "$GITHUB_OUTPUT"

      - name: Check changed paths
        id: filter
        if: ${{ github.ref_type != 'tag' }}
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            workflow:
              - '.github/workflows/ci.yml'
            e2e:
              - 'frontend/e2e/**'
              - 'frontend/playwright.config.ts'

  lint_nuxt:
    name: Lint Nuxt
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
    container:
      image: node:22.19.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run Nuxt lint
        working-directory: frontend
        run: npm run lint .

  test_backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true' }}
    services:
      database-testing:
        image: mariadb:10.6.16
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MARIADB_USER: "test"
          MARIADB_PASSWORD: "test"
          MARIADB_DATABASE: "test"
          MARIADB_ROOT_PASSWORD: "test"
    container:
      image: golang:1.26.2-alpine
    env:
      TESTING_ENVIRONMENT: "github"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: backend
        run: go get

      - name: Run Backend Tests
        working-directory: backend
        run: go test ./...

  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.workflow == 'true' }}
    services:
      database:
        image: mariadb:10.6.16
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MARIADB_USER: "test"
          MARIADB_PASSWORD: "test"
          MARIADB_DATABASE: "test"
          MARIADB_ROOT_PASSWORD: "test"
        ports:
          - 3306:3306
    env:
      TESTING_ENVIRONMENT: "github"
      E2E_BASE_URL: http://localhost:3000
      NUXT_API_HOST: http://localhost:8080
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Install backend dependencies
        working-directory: backend
        run: go mod download

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend server
        working-directory: backend
        run: go run . &
        env:
          GIN_MODE: release
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: test
          JWT_KEY: test-jwt-key
          WEB_HOST: http://localhost:3000
          FIXER_IO_URL: ""
          FIXER_IO_KEY: ""

      - name: Start frontend server
        working-directory: frontend
        run: npm run preview &

      - name: Wait for servers
        run: |
          echo "Waiting for backend..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/health > /dev/null 2>&1; do sleep 1; done' || echo "Backend timeout"
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 1; done' || echo "Frontend timeout"

      - name: Verify E2E test user exists
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          mysql -h 127.0.0.1 -u test -ptest test -e "SELECT id, email FROM users WHERE email = 'e2e@test.liquiswiss.ch';" || echo "User not found"
          mysql -h 127.0.0.1 -u test -ptest test -e "SELECT COUNT(*) as currency_count FROM currencies;" || echo "No currencies"

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 1

  # Resolve the identifiers baked into both images, so a running container can
  # answer what it is (GET /api/config) and CI can diff prod against the release.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      app_sha: ${{ steps.ver.outputs.app_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ver
        run: |
          # Fingerprint only what ends up in the running app, so deploys that
          # touched nothing app-relevant are recognisable as such.
          # `:(exclude)` spelled out, not `:!`: git reads the character after
          # `!` as pathspec magic, so ':!_deployment' aborts the whole listing
          # and the fingerprint silently becomes the hash of an empty input.
          APP_SHA=$(git ls-files -s -- . \
            ':(exclude).github' ':(exclude)_deployment' ':(exclude)docs' ':(exclude).claude' \
            | sha256sum | cut -c1-12)
          if [ -z "$APP_SHA" ] || [ "$APP_SHA" = "e3b0c44298fc" ]; then
            echo "APP_SHA fingerprint is empty, the pathspec matched nothing"; exit 1
          fi
          echo "app_sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

  build_nuxt:
    name: Build Nuxt
    runs-on: ubuntu-latest
    needs: [ version, lint_nuxt, e2e_tests ]
    # Explicit result checks: the default success() also skips when an ancestor
    # job was skipped, even though the jobs that matter succeeded.
    if: ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.lint_nuxt.result == 'success'
      && needs.e2e_tests.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built as a list here rather than inline: an empty line in `tags:` on a
      # non-tag build is an error, not a no-op.
      - name: Resolve image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${NUXT_IMAGE}:latest"
            echo "${NUXT_IMAGE}:${GITHUB_SHA}"
            # `|| true`: the step shell runs with -e, so a false test would abort it
            [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${NUXT_IMAGE}:${GITHUB_REF_NAME}" || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./_deployment/nuxt/Dockerfile
          target: deploy
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ needs.version.outputs.version }}
            APP_SHA=${{ needs.version.outputs.app_sha }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=nuxt
          cache-to: type=gha,scope=nuxt,mode=max

  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [ version, test_backend ]
    if: ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.test_backend.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${BACKEND_IMAGE}:latest"
            echo "${BACKEND_IMAGE}:${GITHUB_SHA}"
            [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${BACKEND_IMAGE}:${GITHUB_REF_NAME}" || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./_deployment/backend/Dockerfile
          target: prod
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ needs.version.outputs.version }}
            APP_SHA=${{ needs.version.outputs.app_sha }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build_nuxt, build_backend ]
    if: ${{ !cancelled()
      && needs.build_backend.result == 'success'
      && needs.build_nuxt.result == 'success' }}
    environment: production
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy backend and nuxt
        run: |
          # What does this release actually change? Diff the sha running in
          # production against the one being deployed and classify the paths.
          PREV=$(curl -sf https://api.liquiswiss.ch/api/config \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
          PARTS=""
          if [ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null; then
            FE=false; BE=false
            for f in $(git diff --name-only "$PREV" "$GITHUB_SHA"); do
              case "$f" in
                frontend/*) FE=true ;;
                backend/*)  BE=true ;;
                *) ;;
              esac
            done
            if $BE && $FE; then PARTS="backend+nuxt"
            elif $FE; then PARTS="nuxt"
            elif $BE; then PARTS="backend"
            fi
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            SCOPE="release ${GITHUB_REF_NAME} ${PARTS}"
          else
            SCOPE="manual ${PARTS}"
          fi
          echo "scope: '${SCOPE}' (prev: ${PREV:-unknown})"

          # One service at a time: the webhook health-checks and rolls back per
          # service, so a broken backend never takes the frontend with it.
          ./_deployment/deploy.sh "${GITHUB_SHA}" backend "$SCOPE"
          ./_deployment/deploy.sh "${GITHUB_SHA}" nuxt "$SCOPE"
